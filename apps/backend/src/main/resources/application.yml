spring:
  application:
    name: venue-aggregator-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/venue_aggregator}
    username: ${DATABASE_USERNAME:venue_app}
    password: ${DATABASE_PASSWORD:venue_app_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

jwt:
  secret: ${JWT_SECRET:staminal-super-secret-key-for-venue-app-2026}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  overture-onboarding:
    enabled: ${OVERTURE_ONBOARDING_ENABLED:false}
    catalog-path: ${OVERTURE_CATALOG_PATH:}
    max-batch-size: ${OVERTURE_MAX_BATCH_SIZE:20}
    media:
      enabled: ${OVERTURE_DRAFT_MEDIA_ENABLED:false}
      bucket: ${OVERTURE_DRAFT_MEDIA_BUCKET:venue-draft-media-private}
  features:
    marketplace-requirements-enabled: ${MARKETPLACE_REQUIREMENTS_ENABLED:false}
    venue-discovery-enabled: ${VENUE_DISCOVERY_ENABLED:false}
  venue-discovery:
    live-api-enabled: ${VENUE_DISCOVERY_LIVE_API_ENABLED:false}
    google-api-key: ${VENUE_DISCOVERY_GOOGLE_API_KEY:}
    max-results: ${VENUE_DISCOVERY_MAX_RESULTS:10}
    daily-request-limit: ${VENUE_DISCOVERY_DAILY_REQUEST_LIMIT:100}
    timeout-seconds: ${VENUE_DISCOVERY_TIMEOUT_SECONDS:10}
  notifications:
    whatsapp:
      sending-enabled: ${WHATSAPP_SENDING_ENABLED:false}
      graph-api-base-url: ${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com}
      graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      lead-template-name: ${WHATSAPP_LEAD_TEMPLATE_NAME:}
      lead-template-language: ${WHATSAPP_LEAD_TEMPLATE_LANGUAGE:en}
      lead-template-url-button-index: ${WHATSAPP_LEAD_TEMPLATE_URL_BUTTON_INDEX:0}
      rollout-allowed-vendor-ids: ${WHATSAPP_ROLLOUT_ALLOWED_VENDOR_IDS:}
      batch-size: ${WHATSAPP_SEND_BATCH_SIZE:20}
      poll-interval-ms: ${WHATSAPP_POLL_INTERVAL_MS:15000}
      initial-delay-ms: ${WHATSAPP_INITIAL_DELAY_MS:15000}
      webhook-enabled: ${WHATSAPP_WEBHOOK_ENABLED:false}
      webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
      app-secret: ${WHATSAPP_APP_SECRET:}
      max-attempts: ${WHATSAPP_MAX_ATTEMPTS:3}
      retry-initial-delay-ms: ${WHATSAPP_RETRY_INITIAL_DELAY_MS:60000}
      retry-max-delay-ms: ${WHATSAPP_RETRY_MAX_DELAY_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
  seed:
    dev-data: ${APP_SEED_DEV_DATA:false}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      presign-endpoint: ${S3_PRESIGN_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:venue-media}
      access-key: ${S3_ACCESS_KEY:venue_minio}
      secret-key: ${S3_SECRET_KEY:venue_minio_password}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/venue-media}
    media:
      max-upload-size-bytes: ${MEDIA_MAX_UPLOAD_SIZE_BYTES:10485760}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /docs
